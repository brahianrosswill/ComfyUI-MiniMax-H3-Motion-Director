name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout compatible ComfyUI
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          ref: dd79c643a95402136a75a28f6187d843bcf457ed
          path: .ci/ComfyUI

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r .ci/ComfyUI/requirements.txt
          python -m pip install -r requirements.txt pytest

      - name: Compile every Python file
        run: python -m compileall -q __init__.py director lib nodes patches tests

      - name: Check frontend JavaScript syntax
        run: |
          node --check web/js/minimax_sampling_ui.js
          node --check web/js/minimax_timeline.js
          node --check web/js/minimax_i18n.js

      - name: Run unit tests
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.ci/ComfyUI
        run: python -m pytest -q

      - name: Run real ComfyUI custom-node loader smoke test
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.ci/ComfyUI
        run: python tests/runtime_load_check.py
